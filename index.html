function norm(s){return String(s??"").toLowerCase().replace(/\s+/g,"").replace(/[　]/g,"");}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function uniqueSorted(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ja"));}

function isSinglePay(row){
  const t = row["小分類"] + " " + row["商品名"];
  return t.includes("一時払") || t.includes("一時払い");
}
function isLevelPayFormation(row){
  const t = row["小分類"] + " " + row["商品名"];
  if(isSinglePay(row)) return false;
  return row["大分類"]==="変額保険" || row["大分類"]==="資産形成" || t.includes("平準払") || t.includes("積立");
}
function isMedical(row){ return row["大分類"]==="医療保険"; }
function isRelaxMedical(row){ return row["大分類"]==="緩和型医療保険"; }
function isDeathWhole(row){
  const t = row["小分類"] + " " + row["商品名"];
  return t.includes("終身保険") && !t.includes("医療") && !t.includes("がん") && !t.includes("ガン") && !t.includes("年金");
}
function isFamily(row){ return row["大分類"]==="収入保障" || row["大分類"]==="死亡保障"; }

function scenarioMatch(row){
  const s = document.getElementById("scenario").value;
  if(s==="all") return true;
  if(["asset40","asset50m","asset50f","oldfund"].includes(s)) return isLevelPayFormation(row);
  if(["operation","retirement","inheritance"].includes(s)) return isSinglePay(row);
  if(["medical60","medical70","medical80"].includes(s)) return isMedical(row);
  if(["relax70","relax80"].includes(s)) return isRelaxMedical(row);
  if(s==="death") return isDeathWhole(row);
  if(["family30","family40","family50"].includes(s)) return isFamily(row);
  if(s==="corp") return !!row["法人推奨"];
  return true;
}

function populateMinor(){
  const prev=document.getElementById("minor").value;
  const cat=document.getElementById("category").value;
  const base=DATA.filter(r=>cat==="all"||r["大分類"]===cat);
  const vals=uniqueSorted(base.map(r=>r["小分類"]));
  document.getElementById("minor").innerHTML=optionHtml("all","小分類：すべて")+vals.map(v=>optionHtml(v,v)).join("");
  if(vals.includes(prev)) document.getElementById("minor").value=prev;
}
function populateCompany(){
  const prev=document.getElementById("company").value;
  const vals=uniqueSorted(baseRows().filter(scenarioMatch).map(r=>r["保険会社"]));
  document.getElementById("company").innerHTML=optionHtml("all","保険会社：すべて")+vals.map(v=>optionHtml(v,v)).join("");
  if(vals.includes(prev)) document.getElementById("company").value=prev;
}

function filteredRows(){
  const cat=document.getElementById("category").value;
  const minor=document.getElementById("minor").value;
  const comp=document.getElementById("company").value;
  const q=norm(document.getElementById("search").value);
  return DATA.filter(r=>{
    if(!scenarioMatch(r)) return false;
    if(cat!=="all" && r["大分類"]!==cat) return false;
    if(minor!=="all" && r["小分類"]!==minor) return false;
    if(comp!=="all" && r["保険会社"]!==comp) return false;
    if(q && !norm(Object.values(r).join(" ")).includes(q)) return false;
    return true;
  });
}
function badge(text,cls=""){return `<span class="badge ${cls}">${escapeHtml(text)}</span>`;}
function highlight(text){
  const q=String(document.getElementById("search").value||"").trim();
  const safe=escapeHtml(text);
  if(!q) return safe;
  const parts=q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!parts.length) return safe;
  try{return safe.replace(new RegExp("("+parts.join("|")+")","gi"),"<mark>$1</mark>");}catch(e){return safe;}
}
function renderProducts(){
  const rows=filteredRows();
  document.getElementById("resultHead").textContent=`検索結果　${rows.length}件`;
  const list=document.getElementById("list");
  if(!rows.length){list.innerHTML=`<div class="empty">該当する商品がありません</div>`;return;}
  list.innerHTML=rows.map(row=>{
    let badges="";
    badges+=badge(row["大分類"],"kind");
    if(row["個人推奨"]) badges+=badge("個人推奨","rec");
    if(row["法人推奨"]) badges+=badge("法人推奨","corp");
    if(row["外貨保険"]) badges+=badge("外貨","fx");
    if(row["変額保険"]) badges+=badge("変額","var");
    if(row["特定保険商品"]) badges+=badge("特定保険商品","spec");
    return `<article class="card">
      <div class="product">${highlight(row["商品名"])}</div>
      <div class="company">${highlight(row["保険会社"])}</div>
      <div class="category">${escapeHtml(row["小分類"])}</div>
      <div class="badges">${badges}</div>
    </article>`;
  }).join("");
}
function resetFilters(){
  document.getElementById("scenario").value="all";
  document.getElementById("category").value="all";
  populateMinor();
  document.getElementById("minor").value="all";
  populateCompany();
  document.getElementById("company").value="all";
  document.getElementById("search").value="";
  renderProducts();
}
document.getElementById("scenario").addEventListener("change",()=>{populateCompany();renderProducts();});
document.getElementById("category").addEventListener("change",()=>{populateMinor();document.getElementById("minor").value="all";populateCompany();document.getElementById("company").value="all";renderProducts();});
document.getElementById("minor").addEventListener("change",()=>{populateCompany();document.getElementById("company").value="all";renderProducts();});
document.getElementById("company").addEventListener("change",renderProducts);
document.getElementById("search").addEventListener("input",renderProducts);
populateSelects();
renderProducts();
</script>
